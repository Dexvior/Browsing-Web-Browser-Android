name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Browsing-android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Browsing-Android-APK
          path: android/Browsing-android-*.apk
      - name: Publish to Releases (easy download on your phone)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: android-latest
          name: Browsing for Android (latest build)
          prerelease: true
          files: android/Browsing-android-*.apk
