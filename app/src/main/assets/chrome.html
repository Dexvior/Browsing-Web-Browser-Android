<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100..900&display=swap">
<style>
:root{--bg:#000;--fg:#fff;--muted:#8c8c8c;--border:#262626;--hover:#141414;--press:#1f1f1f;--ease:cubic-bezier(.4,0,.2,1);--bar:58px}
:root[data-theme=light]{--bg:#fff;--fg:#000;--muted:#6e6e6e;--border:#e2e2e2;--hover:#f3f3f3;--press:#e9e9e9}
*{box-sizing:border-box;font-family:'Urbanist',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-size:inherit;color:inherit}
html,body{height:100%;margin:0;background:transparent;color:var(--fg);font-size:15px;font-weight:500;user-select:none;overflow:hidden}
body{position:fixed;inset:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
#scrim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
body[data-ov] #scrim{opacity:.55;pointer-events:auto}
#bar{position:absolute;left:0;right:0;top:0;z-index:5;height:var(--bar);display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--chrome,var(--bg));border-bottom:1px solid var(--border)}
body[data-pos=bottom] #bar{top:auto;bottom:0;border-bottom:0;border-top:1px solid var(--border)}
.ib{display:grid;place-items:center;flex:none;width:42px;height:42px;padding:0;border:0;border-radius:12px;background:transparent;transition:background .2s,transform .15s,opacity .2s}
.ib:active{background:var(--press);transform:scale(.9)}.ib:disabled{opacity:.28}
.ib svg{transition:transform .4s var(--ease)}#reload.loading svg{animation:spin .9s linear infinite}
#back:active svg{transform:translateX(-3px)}
.pill{flex:1;min-width:0;display:flex;align-items:center;height:40px;margin:0 4px;border:1px solid var(--border);border-radius:20px;transition:border-color .2s,box-shadow .2s}
.pill:focus-within{border-color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--fg) 9%,transparent)}
#url{flex:1;min-width:0;height:100%;padding:0 14px 0 12px;border:0;outline:0;background:transparent;text-overflow:ellipsis;user-select:text}
#url::placeholder{color:var(--muted)}
#lock{display:none;margin-left:12px;color:var(--muted)}#lock[data-s]:not([data-s='']){display:grid}
#lock svg{width:14px;height:14px;stroke-width:1.9}#lock .i{display:none}#lock[data-s=insecure] .i{display:block}#lock[data-s=insecure] .s{display:none}#lock[data-s=insecure]{color:var(--fg)}
#count{display:grid;place-items:center;width:24px;height:24px;border:1.75px solid currentColor;border-radius:7px;font-size:12px;font-weight:700}
#count.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--fg);opacity:0;transition:width .25s var(--ease),opacity .3s}
body[data-pos=bottom] #prog{bottom:auto;top:-1px}#prog.on{opacity:1}
.sheet,.pop,.sugg{position:absolute;z-index:4;background:var(--bg);border:1px solid var(--border);opacity:0;pointer-events:none;transition:transform .32s var(--ease),opacity .22s var(--ease)}
.sheet{left:0;right:0;bottom:0;max-height:80%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;border-bottom:0;transform:translateY(40px)}
body[data-pos=bottom] .sheet{bottom:var(--bar)}
body[data-ov=tabs] #tabsSheet,body[data-ov=settings] #settings{opacity:1;pointer-events:auto;transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 20px}.sh h2{margin:0;font-size:20px;font-weight:700}
.sb{overflow-y:auto;padding:0 20px 18px}
.tcard{display:flex;align-items:center;gap:8px;margin:8px 0;padding:10px 6px 10px 16px;border:1px solid var(--border);border-radius:14px;animation:item-in .3s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.tcard.on{border-color:var(--fg)}.tcard:active{background:var(--hover)}
.tm{flex:1;min-width:0}.tm b,.tm span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tm span{color:var(--muted);font-size:13px;margin-top:2px}
.pbtn{display:block;width:100%;height:46px;margin:6px 0;border:1px solid var(--fg);border-radius:23px;background:transparent;font-weight:700;transition:background .2s,color .2s,transform .15s}
.pbtn:active{background:var(--fg);color:var(--bg);transform:scale(.97)}
.pop{right:8px;top:calc(var(--bar) + 4px);width:230px;padding:6px;border-radius:16px;transform:translateY(-8px) scale(.97);transform-origin:top right}
body[data-pos=bottom] .pop{top:auto;bottom:calc(var(--bar) + 4px);transform-origin:bottom right;transform:translateY(8px) scale(.97)}
body[data-ov=menu] .pop{opacity:1;pointer-events:auto;transform:none}
.mi{display:flex;align-items:center;width:100%;height:46px;padding:0 14px;border:0;border-radius:10px;background:transparent;text-align:left;font-weight:600}
.mi:active{background:var(--hover)}.mi.dis{opacity:.3;pointer-events:none}
.sugg{left:10px;right:10px;top:calc(var(--bar) + 6px);padding:6px;border-radius:16px;transform:translateY(-6px)}
body[data-pos=bottom] .sugg{top:auto;bottom:calc(var(--bar) + 6px);transform:translateY(6px)}
.sugg.on{opacity:1;pointer-events:auto;transform:none}
.sg{padding:10px 12px;border-radius:10px;min-width:0}.sg:active{background:var(--hover)}
.sg b,.sg span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sg span{color:var(--muted);font-size:13px}
.srow{padding:14px 0;border-bottom:1px solid var(--border)}.sl{margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border:1px solid var(--border);border-radius:19px;background:transparent;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.chip:active{transform:scale(.94)}
.sw{width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:50%}.sw.on{outline:2px solid var(--fg);outline-offset:2px}
#toast{position:absolute;left:50%;z-index:6;bottom:calc(var(--bar) + 18px);max-width:86%;padding:12px 20px;border:1px solid var(--fg);border-radius:22px;background:var(--bg);font-weight:600;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
body[data-pos=bottom] #toast{bottom:calc(var(--bar) + 18px)}#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bump{from{transform:scale(1.35)}to{transform:none}}@keyframes item-in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body data-pos="top">
<div id="scrim"></div>
<div id="bar">
  <button class="ib" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ib" id="reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  <div class="pill">
    <span id="lock" data-s=""><svg class="s" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg></span>
    <input id="url" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
  </div>
  <button class="ib" id="tabsBtn" aria-label="Tabs"><span id="count">1</span></button>
  <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" style="stroke-width:2.8"><path d="M12 5h.01M12 12h.01M12 19h.01"/></svg></button>
  <div id="prog"></div>
</div>
<div class="sugg" id="sugg"></div>
<div class="sheet" id="tabsSheet"><div class="sh"><h2>Tabs</h2><button class="ib" id="tClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sb"><div id="tlist"></div><button class="pbtn" id="tNew">New tab</button></div></div>
<div class="pop" id="menu">
  <button class="mi" id="mNew">New tab</button><button class="mi" id="mFwd">Forward</button><button class="mi" id="mShare">Share page</button><button class="mi" id="mSet">Settings</button>
</div>
<div class="sheet" id="settings"><div class="sh"><h2>Settings</h2><button class="ib" id="sClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sb" id="sbody"></div></div>
<div id="toast"></div>
<script>
const send=o=>{try{Android.cmd(JSON.stringify(o))}catch(e){}};
const $=id=>document.getElementById(id);
const ENG={duckduckgo:['DuckDuckGo','https://duckduckgo.com/?q='],google:['Google','https://www.google.com/search?q='],bing:['Bing','https://www.bing.com/search?q='],brave:['Brave','https://search.brave.com/search?q=']};
const COLORS=['#0b3d91','#5b21b6','#0f766e','#15803d','#b91c1c','#b45309','#14213d','#6d28d9'];
const DEF={theme:'dark',color:'#14213d',color2:'#6d28d9',style:'solid',engine:'duckduckgo',pos:'top',desktop:false};
let P={...DEF};try{Object.assign(P,JSON.parse(localStorage.getItem('prefs')||'{}'))}catch(e){}
if(!ENG[P.engine])P.engine='duckduckgo';
let S={tabs:[],active:-1},hist=[],lastV='',ov=null,T=0;
try{hist=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){}
const cur=()=>S.tabs.find(t=>t.id===S.active);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* theme */
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const mix=(a,b)=>'#'+rgb(a).map((v,i)=>Math.round((v+rgb(b)[i])/2).toString(16).padStart(2,'0')).join('');
function applyTheme(){
  const st=document.documentElement.style;['--bg','--fg','--muted','--border','--hover','--press','--chrome'].forEach(k=>st.removeProperty(k));
  let bg,dark;
  if(P.theme==='custom'){
    const g=P.style==='gradient';bg=g?mix(P.color,P.color2):P.color;dark=lum(bg)<.179;const fg=dark?'#ffffff':'#000000';
    const m=n=>`color-mix(in srgb,${fg} ${n}%,${P.color})`;
    st.setProperty('--bg',P.color);st.setProperty('--fg',fg);st.setProperty('--muted',m(62));st.setProperty('--border',m(22));
    st.setProperty('--hover',m(10));st.setProperty('--press',m(16));
    st.setProperty('--chrome',g?`linear-gradient(135deg,${P.color},${P.color2})`:P.color);
  }else{dark=P.theme!=='light';bg=dark?'#000000':'#ffffff'}
  document.documentElement.dataset.theme=dark?'dark':'light';document.body.dataset.pos=P.pos;
  send({c:'bars',bg:bg,dark:dark});send({c:'prefs',s:ENG[P.engine][1],e:ENG[P.engine][0],t:dark?'dark':'light'});
}
function set(o){
  Object.assign(P,o);try{localStorage.setItem('prefs',JSON.stringify(P))}catch(e){}
  applyTheme();if('pos' in o)send({c:'layout',bottom:P.pos==='bottom'});if('desktop' in o)send({c:'desktop',on:P.desktop});
  renderSettings();render();
}

/* overlays: the native view grows to full screen while one is open */
function size(){send({c:'size',h:$('bar').getBoundingClientRect().height,full:!!ov})}
function show(){if(ov)document.body.dataset.ov=ov;else delete document.body.dataset.ov}
function openOv(n){clearTimeout(T);if(ov===n)return;const was=ov;ov=n;if(was){show();return}size();T=setTimeout(show,70)}
function closeOv(){if(!ov)return;ov=null;show();$('sugg').classList.remove('on');if(document.activeElement)document.activeElement.blur();clearTimeout(T);T=setTimeout(size,330)}
window.closeOverlays=closeOv;
$('scrim').onclick=closeOv;

/* rendering */
function render(){
  const t=cur();$('count').textContent=S.tabs.length;
  if(document.activeElement!==$('url'))$('url').value=t&&t.url?host(t.url):'';
  $('back').disabled=!(t&&t.back);$('mFwd').classList.toggle('dis',!(t&&t.fwd));
  $('lock').dataset.s=!t||!t.url?'':t.url.startsWith('https:')?'secure':t.url.startsWith('http:')?'insecure':'';
  const p=t?t.p:100,pr=$('prog');pr.style.width=p+'%';pr.classList.toggle('on',!!t&&t.loading&&p<100);
  $('reload').classList.toggle('loading',!!t&&t.loading);
  if(ov==='tabs')renderTabs();
}
function renderTabs(){
  const l=$('tlist');l.textContent='';
  S.tabs.forEach((t,i)=>{
    const c=document.createElement('div');c.className='tcard'+(t.id===S.active?' on':'');c.style.setProperty('--i',i);
    const m=document.createElement('div');m.className='tm';const a=document.createElement('b'),b=document.createElement('span');
    a.textContent=t.title||host(t.url)||'New Tab';b.textContent=t.url?host(t.url):'New tab';m.append(a,b);
    const x=document.createElement('button');x.className='ib';x.setAttribute('aria-label','Close tab');x.innerHTML=X;
    x.onclick=e=>{e.stopPropagation();send({c:'close',id:t.id})};
    c.append(m,x);c.onclick=()=>{send({c:'select',id:t.id});closeOv()};l.appendChild(c);
  });
}
function chips(label,opts,curv,fn){
  const r=document.createElement('div');r.className='srow';const l=document.createElement('div');l.className='sl';l.textContent=label;
  const c=document.createElement('div');c.className='chips';
  opts.forEach(([v,t])=>{const b=document.createElement('button');b.className='chip'+(v===curv?' on':'');b.textContent=t;b.onclick=()=>fn(v);c.appendChild(b)});
  r.append(l,c);return r;
}
function swatches(label,curv,fn){
  const r=document.createElement('div');r.className='srow';const l=document.createElement('div');l.className='sl';l.textContent=label;
  const c=document.createElement('div');c.className='chips';
  COLORS.forEach(v=>{const b=document.createElement('button');b.className='sw'+(v===curv?' on':'');b.style.background=v;b.setAttribute('aria-label',v);b.onclick=()=>fn(v);c.appendChild(b)});
  r.append(l,c);return r;
}
function renderSettings(){
  const b=$('sbody');b.textContent='';
  const rows=[chips('Theme',[['dark','Black'],['light','White'],['custom','Custom']],P.theme,v=>set({theme:v}))];
  if(P.theme==='custom'){
    rows.push(swatches('Color',P.color,v=>set({color:v})),chips('Style',[['solid','Solid'],['gradient','Gradient']],P.style,v=>set({style:v})));
    if(P.style==='gradient')rows.push(swatches('Fade to',P.color2,v=>set({color2:v})));
  }
  rows.push(chips('Toolbar',[['top','Top'],['bottom','Bottom']],P.pos,v=>set({pos:v})),
    chips('Search engine',Object.keys(ENG).map(k=>[k,ENG[k][0]]),P.engine,v=>set({engine:v})),
    chips('Desktop site',[['0','Off'],['1','On']],P.desktop?'1':'0',v=>set({desktop:v==='1'})));
  const clr=document.createElement('button');clr.className='pbtn';clr.style.marginTop='18px';clr.textContent='Clear cookies and cache';
  clr.onclick=()=>{send({c:'clear'})};rows.push(clr);
  b.append(...rows);
}

/* navigation */
function resolve(raw){
  const v=raw.trim();if(!v)return null;
  if(/^(https?|file|about):/i.test(v))return v;
  if(!/\s/.test(v)&&/^(localhost|(\d{1,3}\.){3}\d{1,3}|([a-z0-9-]+\.)+[a-z]{2,})(:\d+)?([/?#].*)?$/i.test(v))return(/^(localhost|\d)/i.test(v)?'http://':'https://')+v;
  return ENG[P.engine][1]+encodeURIComponent(v);
}
function go(raw){const u=resolve(raw);if(!u)return;send({c:'go',url:u});closeOv()}
const url=$('url');
url.addEventListener('focus',()=>{const t=cur();url.value=t?t.url:'';url.select();openOv('omni');buildSugg()});
url.addEventListener('blur',()=>setTimeout(()=>{if(ov==='omni')closeOv();render()},120));
url.addEventListener('input',buildSugg);
url.addEventListener('keydown',e=>{if(e.key==='Enter')go(url.value)});
function visit(u,t){
  if(!/^https?:/.test(u))return;
  let h=hist.find(x=>x.u===u);
  if(h){h.c++;if(t)h.t=t;hist.splice(hist.indexOf(h),1);hist.unshift(h)}else hist.unshift({u:u,t:t||'',c:1});
  if(hist.length>300)hist.pop();try{localStorage.setItem('hist',JSON.stringify(hist))}catch(e){}
}
function buildSugg(){
  const raw=url.value.trim(),q=raw.toLowerCase(),box=$('sugg'),t=cur();box.textContent='';
  if(!q||(t&&url.value===t.url)){box.classList.remove('on');return}
  const hits=hist.filter(h=>(h.u+' '+h.t).toLowerCase().includes(q)).slice(0,5);
  [{typed:1,u:raw},...hits].forEach(s=>{
    const r=document.createElement('div');r.className='sg';const b=document.createElement('b'),sp=document.createElement('span');
    if(s.typed){b.textContent=s.u;sp.textContent='Search with '+ENG[P.engine][0]}else{b.textContent=s.t||host(s.u);sp.textContent=host(s.u)}
    r.append(b,sp);r.addEventListener('pointerdown',e=>{e.preventDefault();go(s.u)});box.appendChild(r);
  });
  box.classList.add('on');
}
let tTimer=0;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tTimer);tTimer=setTimeout(()=>e.classList.remove('on'),2200)}
window.onNative=o=>{
  if(o.toast)return toast(o.toast);
  const n=S.tabs.length;S=o;
  if(S.tabs.length!==n){const c=$('count');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
  const t=cur();if(t&&t.url&&!t.loading&&t.url!==lastV){lastV=t.url;visit(t.url,t.title)}
  render();
};

/* buttons */
$('back').onclick=()=>send({c:'back'});$('reload').onclick=()=>send({c:'reload'});
$('tabsBtn').onclick=()=>{renderTabs();openOv('tabs')};$('tClose').onclick=closeOv;
$('tNew').onclick=()=>{send({c:'new',url:''});closeOv()};
$('menuBtn').onclick=()=>ov==='menu'?closeOv():openOv('menu');
$('mNew').onclick=()=>{send({c:'new',url:''});closeOv()};
$('mFwd').onclick=()=>{send({c:'forward'});closeOv()};
$('mShare').onclick=()=>{send({c:'share'});closeOv()};
$('mSet').onclick=()=>{renderSettings();ov='settings';show()};
$('sClose').onclick=closeOv;

/* start */
send({c:'layout',bottom:P.pos==='bottom'});send({c:'desktop',on:P.desktop});
applyTheme();size();send({c:'ready'});
</script>
</body>
</html>
